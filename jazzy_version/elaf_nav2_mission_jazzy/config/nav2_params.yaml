# Elaf Nav2 Mission — ROS 2 Jazzy
# SPEED: controller_server -> FollowPath -> vx_max (shared with the bridge).
# ROUTE: four [x, y, yaw radians] goals and laps are under mission.
# FOOTPRINT: full 0.58 x 0.31 m body at the rear axle, 0.17145 m behind simulator CoG.
# INFLATION: radius 0.55 m; scaling 8.0 keeps the high-cost band narrow.
# RECOVERY: a short collision-checked straight backup, with no in-place spin.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Ackermann
      vx_max: 6.0
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.5
      model_dt: 0.05
      time_steps: 56
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      prune_distance: 4.0
      transform_tolerance: 0.2
      retry_attempt_limit: 1
      reset_period: 1.0
      visualize: false
      regenerate_noises: false
      AckermannConstraints:
        min_turning_r: 0.7809964431
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        # Preserve Humble's collision-checking sampling density.
        trajectory_point_step: 1
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 2
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 2
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        max_path_occupancy_ratio: 0.1
        trajectory_point_step: 2
        threshold_to_consider: 0.5
        offset_from_furthest: 1
        use_path_orientations: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: ego_racecar/rear_axle
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 2.0
      resolution: 0.025
      footprint: '[[0.4551,0.155],[0.4551,-0.155],[-0.1249,-0.155],[-0.1249,0.155]]'
      footprint_padding: 0.02
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 8.0
      always_send_full_costmap: true
      rolling_window: true
      width: 10
      height: 10
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /elaf/scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.05
          obstacle_max_range: 4.5
          raytrace_min_range: 0.05
          raytrace_max_range: 5.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.5
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: ego_racecar/rear_axle
      transform_tolerance: 0.3
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      footprint: '[[0.4551,0.155],[0.4551,-0.155],[-0.1249,-0.155],[-0.1249,0.155]]'
      footprint_padding: 0.04
      track_unknown_space: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 8.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.15
      allow_unknown: false
      downsample_costmap: false
      motion_model_for_search: DUBIN
      angle_quantization_bins: 144
      minimum_turning_radius: 0.9
      max_planning_time: 5.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      change_penalty: 0.0
      reverse_penalty: 3.0
      retrospective_penalty: 0.015
      lookup_table_size: 15.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 100
        w_smooth: 0.1
        w_data: 0.4
        tolerance: 1.0e-10
        do_refinement: false
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: ego_racecar/rear_axle
    odom_topic: /ego_racecar/odom
    bt_loop_duration: 20
    default_server_timeout: 100
    wait_for_service_timeout: 2000
    # Jazzy automatically loads the built-in Nav2 BT plugins.
ackermann_bridge:
  ros__parameters:
    use_sim_time: false
    wheelbase: 0.3302
    max_steering: 0.4
    acceleration: 2.0
    deceleration: 5.0
    steering_rate: 3.2
    command_timeout: 0.4
    sensor_timeout: 0.5
    max_reverse_speed: 0.2
mission:
  ros__parameters:
    use_sim_time: false
    laps: 3
    switch_distance: 1.5
    start_line_x: -12.0
    timeout: 1200.0
    waypoint_1:
    - 10.15
    - 3.0
    - 1.5707963268
    waypoint_2:
    - -5.5
    - 8.15
    - 3.1415926536
    waypoint_3:
    - -13.7
    - 6.0
    - -1.5707963268
    waypoint_4:
    - -11.5
    - 0.0
    - 0.0
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: map  # Preserve the simulator's map-only TF for backup.
    global_frame: map
    robot_base_frame: ego_racecar/rear_axle
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    behavior_plugins:
    - backup
    backup:
      plugin: nav2_behaviors::BackUp
      acceleration_limit: 0.5
      deceleration_limit: -1.0
      minimum_speed: 0.05
